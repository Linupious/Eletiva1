<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formulário de Cliente</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<main class="container-fluid py-4">
		<form action="#" method="post" class="mx-auto" style="max-width: 850px;">
			<div class="row g-3 align-items-end mb-3">
				<div class="col-2 col-md-1">
					<label for="codigo" class="form-label fw-bold small">Código</label>
					<input type="text" class="form-control form-control-sm" id="codigo" name="codigo" value="32" readonly>
				</div>
				<div class="col-10 col-md-5">
					<label for="nome" class="form-label fw-bold small">Nome</label>
					<input type="text" class="form-control form-control-sm" id="nome" name="nome" placeholder="Nome Completo do Cliente">
				</div>
				<div class="col-8 col-md-4">
					<label for="email" class="form-label fw-bold small">E-mail</label>
					<input type="email" class="form-control form-control-sm" id="email" name="email" placeholder="cliente@dominio.com">
				</div>
				<div class="col-4 col-md-2">
					<label for="cpf" class="form-label fw-bold small">CPF</label>
					<input type="text" class="form-control form-control-sm" id="cpf" name="cpf" placeholder="Só números">
				</div>
			</div>

			<div class="row g-3 align-items-end mb-3">
				<div class="col-6 col-md-2">
					<label for="celular" class="form-label fw-bold small">Nº Celular</label>
					<input type="tel" class="form-control form-control-sm" id="celular" name="celular" placeholder="Nº do celular">
				</div>
				<div class="col-6 col-md-2">
					<label for="telefone" class="form-label fw-bold small">Nº Telefone fixo</label>
					<input type="tel" class="form-control form-control-sm" id="telefone" name="telefone" placeholder="Nº telefone">
				</div>
				<div class="col-6 col-md-2">
					<label for="cep" class="form-label fw-bold small">CEP</label>
					<input type="text" class="form-control form-control-sm" id="cep" name="cep" placeholder="ex:88308070">
				</div>
				<div class="col-8 col-md-2">
					<label for="logradouro" class="form-label fw-bold small">Logradouro</label>
					<input type="text" class="form-control form-control-sm" id="logradouro" name="logradouro" placeholder="ex:Rua 1400,">
				</div>
				<div class="col-4 col-md-1">
					<label for="numero" class="form-label fw-bold small">Nº</label>
					<input type="text" class="form-control form-control-sm" id="numero" name="numero" placeholder="Nº">
				</div>
				<div class="col-12 col-md-3">
					<label for="bairro" class="form-label fw-bold small">Bairro</label>
					<input type="text" class="form-control form-control-sm" id="bairro" name="bairro" placeholder="Bairro">
				</div>
			</div>

			<div class="row g-3 align-items-end">
				<div class="col-8 col-md-3">
					<label for="cidade" class="form-label fw-bold small">Cidade</label>
					<input type="text" class="form-control form-control-sm" id="cidade" name="cidade" placeholder="Cidade">
				</div>
				<div class="col-4 col-md-1">
					<label for="uf" class="form-label fw-bold small">UF</label>
					<input type="text" class="form-control form-control-sm" id="uf" name="uf" placeholder="UF" maxlength="2">
				</div>
				<div class="col-8 col-md-2">
					<label for="status" class="form-label fw-bold small">Status</label>
					<select class="form-select form-select-sm" id="status" name="status">
						<option selected>Selecione</option>
						<option value="ativo">Ativo</option>
						<option value="inativo">Inativo</option>
					</select>
				</div>
			</div>

			<div class="d-flex justify-content-end gap-1 mt-3">
				<button type="reset" class="btn btn-danger btn-sm">Resetar</button>
				<button type="submit" class="btn btn-success btn-sm">Próximo</button>
			</div>
		</form>
	</main>
</body>
</html>
