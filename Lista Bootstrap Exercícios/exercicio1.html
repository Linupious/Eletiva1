<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Exercícios - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-4">
        <h1 class="text-center fs-5 fw-bold mb-4">Lista de Exercícios - Bootstrap</h1>

        <section class="mx-auto" style="max-width: 800px;">
            <h2 class="fs-6 fw-bold mb-4">Formulário 1</h2>

            <form class="border-top pt-3" action="#" method="post">
                <div class="row g-2 mb-2">
                    <div class="col-md-4">
                        <label for="first-name" class="form-label small mb-1">First name</label>
                        <input type="text" class="form-control form-control-sm" id="first-name" name="first_name" placeholder="Mark">
                    </div>
                    <div class="col-md-4">
                        <label for="last-name" class="form-label small mb-1">Last name</label>
                        <input type="text" class="form-control form-control-sm" id="last-name" name="last_name" placeholder="Otto">
                    </div>
                    <div class="col-md-4">
                        <label for="username" class="form-label small mb-1">Username</label>
                        <div class="input-group input-group-sm">
                            <span class="input-group-text">@</span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Username">
                        </div>
                    </div>
                </div>

                <div class="row g-2 mb-2">
                    <div class="col-md-6">
                        <label for="city" class="form-label small mb-1">City</label>
                        <input type="text" class="form-control form-control-sm" id="city" name="city" placeholder="City">
                    </div>
                    <div class="col-md-3">
                        <label for="state" class="form-label small mb-1">State</label>
                        <input type="text" class="form-control form-control-sm" id="state" name="state" placeholder="State">
                    </div>
                    <div class="col-md-3">
                        <label for="zip" class="form-label small mb-1">Zip</label>
                        <input type="text" class="form-control form-control-sm" id="zip" name="zip" placeholder="Zip">
                    </div>
                </div>

                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="terms" name="terms">
                    <label class="form-check-label small" for="terms">Agree to terms and conditions</label>
                </div>

                <button type="submit" class="btn btn-primary btn-sm">Submit form</button>
            </form>
        </section>
    </main>
</body>
</html>
