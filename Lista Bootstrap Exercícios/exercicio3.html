<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sample Form</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<main class="container py-3">
		<h1 class="text-center fs-4 fw-bold mb-3">Sample Form</h1>

		<form action="#" method="post" class="mx-auto" style="max-width: 800px;">
			<div class="row g-3 align-items-center mb-2">
				<label for="partner-name" class="col-md-2 col-form-label text-md-end fw-bold small">Partner Name</label>
				<div class="col-md-4">
					<input type="text" class="form-control form-control-sm" id="partner-name" name="partner_name">
				</div>
				<label for="partner-email" class="col-md-2 col-form-label text-md-end fw-bold small">Partner Email ID</label>
				<div class="col-md-4">
					<input type="email" class="form-control form-control-sm" id="partner-email" name="partner_email">
				</div>
			</div>

			<div class="row g-3 align-items-center mb-2">
				<label for="legal-name" class="col-md-2 col-form-label text-md-end fw-bold small">Partner Legal Name</label>
				<div class="col-md-4">
					<input type="text" class="form-control form-control-sm" id="legal-name" name="legal_name">
				</div>
				<label for="mobile" class="col-md-2 col-form-label text-md-end fw-bold small">Partner Mobile</label>
				<div class="col-md-4">
					<input type="tel" class="form-control form-control-sm" id="mobile" name="mobile">
				</div>
			</div>

			<div class="row g-3 align-items-start mb-2">
				<label for="address" class="col-md-2 col-form-label text-md-end fw-bold small">Partner Address</label>
				<div class="col-md-10">
					<textarea class="form-control form-control-sm" id="address" name="address" rows="2"></textarea>
				</div>
			</div>

			<div class="row g-3 align-items-center mb-2">
				<label for="start-date" class="col-md-2 col-form-label text-md-end fw-bold small">Contract Start Date</label>
				<div class="col-md-4">
					<input type="date" class="form-control form-control-sm" id="start-date" name="start_date" placeholder="Date Start">
				</div>
				<label for="expiry-date" class="col-md-2 col-form-label text-md-end fw-bold small">Contract Expiry Date</label>
				<div class="col-md-4">
					<input type="date" class="form-control form-control-sm" id="expiry-date" name="expiry_date" placeholder="Date End">
				</div>
			</div>

			<div class="row g-3 align-items-center mb-2">
				<label for="minimum-loan" class="col-md-2 col-form-label text-md-end fw-bold small">Minimum Loan Amount</label>
				<div class="col-md-4">
					<input type="number" class="form-control form-control-sm" id="minimum-loan" name="minimum_loan" min="0" step="0.01">
				</div>
				<label for="maximum-loan" class="col-md-2 col-form-label text-md-end fw-bold small">Maximum Loan Amount</label>
				<div class="col-md-4">
					<input type="number" class="form-control form-control-sm" id="maximum-loan" name="maximum_loan" min="0" step="0.01">
				</div>
			</div>

			<div class="row g-3 align-items-center">
				<label for="interest-rate" class="col-md-2 col-form-label text-md-end fw-bold small">Interest Rate</label>
				<div class="col-md-4">
					<input type="number" class="form-control form-control-sm" id="interest-rate" name="interest_rate" min="0" step="0.01">
				</div>
				<label for="deposit" class="col-md-2 col-form-label text-md-end fw-bold small">Deposit Amount</label>
				<div class="col-md-4">
					<input type="number" class="form-control form-control-sm" id="deposit" name="deposit" min="0" step="0.01">
				</div>
			</div>

			<div class="text-center mt-3">
				<button type="submit" class="btn btn-primary btn-sm px-3">Save</button>
			</div>
		</form>
	</main>
</body>
</html>
