<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Billing address</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<main class="container py-4">
		<form action="#" method="post" class="bg-light p-3 mx-auto" style="max-width: 520px;">
			<h1 class="fs-5 fw-bold mb-3">Billing address</h1>

			<div class="row g-3 mb-3">
				<div class="col-md-6">
					<label for="first-name" class="form-label small">First name</label>
					<input type="text" class="form-control form-control-sm" id="first-name" name="first_name">
				</div>
				<div class="col-md-6">
					<label for="last-name" class="form-label small">Last name</label>
					<input type="text" class="form-control form-control-sm" id="last-name" name="last_name">
				</div>
			</div>

			<div class="mb-3">
				<label for="username" class="form-label small">Username</label>
				<div class="input-group input-group-sm">
					<span class="input-group-text">@</span>
					<input type="text" class="form-control" id="username" name="username" placeholder="Username">
				</div>
			</div>

			<div class="mb-3">
				<label for="email" class="form-label small">Email (Optional)</label>
				<input type="email" class="form-control form-control-sm" id="email" name="email" placeholder="you@example.com">
			</div>

			<div class="mb-3">
				<label for="address" class="form-label small">Address</label>
				<input type="text" class="form-control form-control-sm" id="address" name="address" placeholder="1234 Main St">
			</div>

			<div class="mb-3">
				<label for="address2" class="form-label small">Address 2 (Optional)</label>
				<input type="text" class="form-control form-control-sm" id="address2" name="address2" placeholder="Apartment or suite">
			</div>

			<div class="row g-3">
				<div class="col-md-5">
					<label for="country" class="form-label small">Country</label>
					<select class="form-select form-select-sm" id="country" name="country">
						<option selected>Choose...</option>
						<option value="brasil">Brazil</option>
						<option value="eua">United States</option>
					</select>
				</div>
				<div class="col-md-4">
					<label for="state" class="form-label small">State</label>
					<select class="form-select form-select-sm" id="state" name="state">
						<option selected>Choose...</option>
						<option value="sp">São Paulo</option>
						<option value="sc">Santa Catarina</option>
					</select>
				</div>
				<div class="col-md-3">
					<label for="zip" class="form-label small">Zip</label>
					<input type="text" class="form-control form-control-sm" id="zip" name="zip">
				</div>
			</div>
		</form>
	</main>
</body>
</html>
