<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Novo Usuário</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<main class="container py-4">
		<h1 class="display-6 mb-4">Novo Usuário</h1>

		<form action="#" method="post" class="mx-auto" style="max-width: 900px;">
			<div class="mb-3">
				<label for="nome" class="form-label small">Nome:</label>
				<input type="text" class="form-control form-control-sm" id="nome" name="nome" placeholder="Informe o nome...">
			</div>

			<div class="row g-3 mb-3">
				<div class="col-md-3">
					<label for="cpf" class="form-label small">CPF:</label>
					<input type="text" class="form-control form-control-sm" id="cpf" name="cpf" placeholder="Informe o cpf...">
				</div>
				<div class="col-md-6">
					<label for="endereco" class="form-label small">Endereço:</label>
					<input type="text" class="form-control form-control-sm" id="endereco" name="endereco" placeholder="Informe o endereço...">
				</div>
				<div class="col-md-3">
					<label for="nivel" class="form-label small">Nível:</label>
					<select class="form-select form-select-sm" id="nivel" name="nivel">
						<option selected>--</option>
						<option value="basico">Básico</option>
						<option value="intermediario">Intermediário</option>
						<option value="avancado">Avançado</option>
					</select>
				</div>
			</div>

			<div class="row g-3 mb-3">
				<div class="col-md-5">
					<label for="email" class="form-label small">Email:</label>
					<input type="email" class="form-control form-control-sm" id="email" name="email" placeholder="Informe o email...">
				</div>
				<div class="col-md-4">
					<label for="senha" class="form-label small">Senha:</label>
					<input type="password" class="form-control form-control-sm" id="senha" name="senha" placeholder="Informe a senha...">
				</div>
				<div class="col-md-3">
					<label for="status" class="form-label small">Status:</label>
					<select class="form-select form-select-sm" id="status" name="status">
						<option selected>--</option>
						<option value="ativo">Ativo</option>
						<option value="inativo">Inativo</option>
					</select>
				</div>
			</div>

			<div class="d-flex justify-content-end gap-2">
				<button type="submit" class="btn btn-success btn-sm">Enviar</button>
				<button type="reset" class="btn btn-light btn-sm border">Cancelar</button>
			</div>
		</form>
	</main>
</body>
</html>
